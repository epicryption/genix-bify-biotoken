name: Infrastructure IaC Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ENV_ROOT: "Environment Orchestration/\u200benvs"
  BACKEND_ROOT: "backends/backends"
  POLICY_ROOT: "Security and Compliance Policies /policies."

jobs:
  validate_and_plan:
    name: Validate, lint and plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [us-east, eu-west, ap-se, failover]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.2
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc-deploy
          aws-region: us-east-1
      - name: Check formatting
        run: tofu fmt -check -recursive
      - name: Run TFLint
        run: |
          tflint --init --config "${{ github.workspace }}/${{ env.POLICY_ROOT }}/tflint.hcl"
          tflint --recursive --config "${{ github.workspace }}/${{ env.POLICY_ROOT }}/tflint.hcl"
      - name: Run Checkov
        run: checkov -d . --config-file "${{ github.workspace }}/${{ env.POLICY_ROOT }}/checkov.yml"
      - name: Initialize environment
        run: |
          cd "${ENV_ROOT}/${{ matrix.environment }}"
          tofu init -backend-config="../../../${BACKEND_ROOT}/${{ matrix.environment }}.hcl"
      - name: Validate environment
        run: tofu -chdir="${ENV_ROOT}/${{ matrix.environment }}" validate
      - name: Plan environment
        run: |
          tofu -chdir="${ENV_ROOT}/${{ matrix.environment }}" plan -no-color -out=tfplan
          tofu -chdir="${ENV_ROOT}/${{ matrix.environment }}" show -no-color tfplan > "${ENV_ROOT}/${{ matrix.environment }}/plan_output.txt"
      - name: Post plan to pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.ENV_ROOT}/${{ matrix.environment }}/plan_output.txt`, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Environment: \`${{ matrix.environment }}\`\n\n\`\`\`\n${plan.substring(0, 60000)}\n\`\`\``
            });

  apply:
    name: Apply infrastructure (${{ matrix.environment }})
    needs: validate_and_plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [us-east, eu-west, ap-se, failover]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.2
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-oidc-deploy
          aws-region: us-east-1
      - name: Initialize environment
        run: |
          cd "${ENV_ROOT}/${{ matrix.environment }}"
          tofu init -backend-config="../../../${BACKEND_ROOT}/${{ matrix.environment }}.hcl"
      - name: Apply environment
        run: |
          tofu -chdir="${ENV_ROOT}/${{ matrix.environment }}" plan -out=tfplan
          tofu -chdir="${ENV_ROOT}/${{ matrix.environment }}" apply -auto-approve tfplan
